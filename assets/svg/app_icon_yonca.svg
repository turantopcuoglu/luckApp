<!-- Uygulama ikonu taslağı: lacivert (#0A0E1A) zeminde altın (#F4C95D)
     dört yapraklı yonca, flat stil, 512x512. Her yaprak merkeze bakan
     kalp biçimidir; tek yaprak tanımlanıp 90 derece adımlarla döndürülür. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0A0E1A"/>
  <g transform="translate(256 264)">
    <g fill="#F4C95D">
      <!-- Yukarı bakan yaprak; ucu merkezde, lobları dışarıda. -->
      <path d="M0 -8 C-18 -60 -104 -60 -104 -122 C-104 -166 -58 -184 -29 -156 C-11 -139 0 -120 0 -102 C0 -120 11 -139 29 -156 C58 -184 104 -166 104 -122 C104 -60 18 -60 0 -8 Z"/>
      <path d="M0 -8 C-18 -60 -104 -60 -104 -122 C-104 -166 -58 -184 -29 -156 C-11 -139 0 -120 0 -102 C0 -120 11 -139 29 -156 C58 -184 104 -166 104 -122 C104 -60 18 -60 0 -8 Z" transform="rotate(90)"/>
      <path d="M0 -8 C-18 -60 -104 -60 -104 -122 C-104 -166 -58 -184 -29 -156 C-11 -139 0 -120 0 -102 C0 -120 11 -139 29 -156 C58 -184 104 -166 104 -122 C104 -60 18 -60 0 -8 Z" transform="rotate(180)"/>
      <path d="M0 -8 C-18 -60 -104 -60 -104 -122 C-104 -166 -58 -184 -29 -156 C-11 -139 0 -120 0 -102 C0 -120 11 -139 29 -156 C58 -184 104 -166 104 -122 C104 -60 18 -60 0 -8 Z" transform="rotate(270)"/>
    </g>
    <!-- Sap: merkezden sağ alta kıvrılan kısa çizgi. -->
    <path d="M6 10 C30 60 24 96 52 132" stroke="#F4C95D" stroke-width="18" stroke-linecap="round" fill="none"/>
  </g>
</svg>
