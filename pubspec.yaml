name: kader
description: "Şans uygulaması — günlük kader skoru."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  # ONAY NOTU: flutter_localizations (SDK paketi), Türkçe Material
  # bileşenleri (showTimePicker vb.) ve lokalizasyon delegate'leri için
  # eklendi. Turan onayladı. Harici paket değil, Flutter SDK'sının parçası.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # ONAY NOTU: crypto, luck_engine'in deterministik SHA-256 seed'i için
  # eklendi (plan Session 1, madde 2). Saf Dart paketidir, Flutter
  # bağımlılığı yoktur. Onaylamıyorsan söyle, elle SHA-256 yazayım.
  crypto: ^3.0.6
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  # ONAY NOTU: share_plus, story kartının sistem paylaşım menüsüne
  # verilmesi için eklendi (plan Session 7, madde 3). Onaylamıyorsan
  # söyle, kaldırıp yalnızca PNG üretimini bırakayım.
  share_plus: ^10.1.4
  # ONAY NOTU: flutter_local_notifications + timezone, 21:00 ve 08:30
  # lokal bildirimleri için eklendi (plan Session 8). timezone,
  # zamanlanmış bildirimlerin zorunlu bağımlılığıdır.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  # ONAY NOTU: home_widget, günün skorunu telefon ana ekranı widget'ında
  # göstermek için eklendi (Phase 7). Flutter ↔ native (Android AppWidget /
  # iOS WidgetKit) köprüsüdür. Turan onayladı. luck_engine'e dokunmaz.
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  # ONAY NOTU: flutter_launcher_icons + flutter_native_splash, yonca
  # uygulama ikonunu ve lacivert açılış (splash) ekranını native
  # kaynaklara bağlamak için eklendi (Phase 5). Turan onayladı. Yalnız
  # build-time dev araçlarıdır; uygulamaya/luck_engine'e bağlanmaz.
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/images/card_luminous_v5.png
    - assets/images/portal_radiant_v5.png
    - assets/images/portal_twilight_v5.png
    - assets/images/sanctuary_sealed_v6.png
    - assets/images/sanctuary_radiant_v6.png
    - assets/images/sanctuary_twilight_v6.png
    - assets/images/cosmic_mark_v4.png
    - assets/images/glass_orb_v4.png
    - assets/images/quiet_night_v4.png
    - assets/images/moon_path_v4.png
    - assets/images/story_night_v4.png
    - assets/images/story_light_v4.png
    - assets/images/story_violet_v4.png
    - assets/images/rare_acik_kapi_v4.png
    - assets/images/rare_kesisen_yollar_v4.png
    - assets/images/rare_sessiz_tohum_v4.png
    - assets/images/rare_ucan_not_v4.png
    - assets/images/rare_dengeli_tas_v4.png
    - assets/images/rare_yeni_patika_v4.png
    - assets/images/rare_geri_donen_serit_v4.png
    - assets/images/rare_kucuk_kopru_v4.png
    - assets/images/rare_acik_pencere_v4.png
    - assets/images/rare_beklenmedik_durak_v4.png
    - assets/images/rare_yan_yana_izler_v4.png
    - assets/images/rare_parlak_yol_v4.png
    - assets/images/archetypes/
    - assets/images/rare_signs/
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/PlayfairDisplay-OFL.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf

# Uygulama ikonu üretimi (dart run flutter_launcher_icons).
# Kaynak PNG'ler assets/launcher/ altında; test/brand/brand_asset_export_test.dart
# üretim sahnesini iç boşluk eklemeden, tam kare olarak paketler. Bunlar native kaynaklara
# gömülür — bu yüzden flutter.assets'e eklenmez.
flutter_launcher_icons:
  image_path: assets/launcher/cosmic-icon-v4.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#041428"
  adaptive_icon_foreground: assets/launcher/cosmic-foreground-v4.png
  adaptive_icon_foreground_inset: 0

# Açılış (splash) ekranı üretimi (dart run flutter_native_splash:create).
flutter_native_splash:
  color: "#041428"
  image: assets/launcher/cosmic-foreground-v4.png
  android_12:
    color: "#041428"
    image: assets/launcher/cosmic-foreground-v4.png
