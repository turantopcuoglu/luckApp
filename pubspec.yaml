name: kader
description: "Şans uygulaması — günlük kader skoru."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  # ONAY NOTU: flutter_localizations (SDK paketi), Türkçe Material
  # bileşenleri (showTimePicker vb.) ve lokalizasyon delegate'leri için
  # eklendi. Turan onayladı. Harici paket değil, Flutter SDK'sının parçası.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # ONAY NOTU: crypto, luck_engine'in deterministik SHA-256 seed'i için
  # eklendi (plan Session 1, madde 2). Saf Dart paketidir, Flutter
  # bağımlılığı yoktur. Onaylamıyorsan söyle, elle SHA-256 yazayım.
  crypto: ^3.0.6
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  # ONAY NOTU: share_plus, story kartının sistem paylaşım menüsüne
  # verilmesi için eklendi (plan Session 7, madde 3). Onaylamıyorsan
  # söyle, kaldırıp yalnızca PNG üretimini bırakayım.
  share_plus: ^10.1.4
  # ONAY NOTU: flutter_local_notifications + timezone, 21:00 ve 08:30
  # lokal bildirimleri için eklendi (plan Session 8). timezone,
  # zamanlanmış bildirimlerin zorunlu bağımlılığıdır.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
